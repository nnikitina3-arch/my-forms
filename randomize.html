<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Перенаправление...</title>
</head>
<body>
  <script>
    // Функция для установки cookie
    function setCookie(name, value, days) {
      const expires = new Date(Date.now() + days * 24 * 60 * 60 * 1000).toUTCString();
      document.cookie = name + '=' + encodeURIComponent(value) + ';expires=' + expires + ';path=/';
    }

    // Функция для получения значения cookie
    function getCookie(name) {
      return document.cookie.split('; ').reduce((r, v) => {
        const parts = v.split('=');
        return parts[0] === name ? decodeURIComponent(parts[1]) : r;
      }, '');
    }

    // Главный массив с вашими ссылками
    const forms = [
      "https://docs.google.com/forms/d/e/1FAIpQLSc4NuwXsa92dtDXniORObZhvd0PapZH5mbllIWxdg-WkgjG4Q/viewform?usp=dialog",
      "https://docs.google.com/forms/d/e/1FAIpQLSduCSzDXKNRAg4yqBEisPesHHkj6NCPGeoHhRllAu60T_U-Qg/viewform?usp=header",
      "https://docs.google.com/forms/d/e/1FAIpQLSeudnFIJ3sRC8fSLX2CiSPji2mBX6KGsBTCEV8IARYsicdH5A/viewform?usp=header",
      "https://docs.google.com/forms/d/e/1FAIpQLSdmw984eCRjBOsJidYagyEPkJvzltSqyX8nrGmHN4claApTEw/viewform?usp=header"
    ];

    const COOKIE_NAME = 'selectedFormIndex';

    // Проверяем, закреплена ли уже форма за этим пользователем
    let selectedIndex = getCookie(COOKIE_NAME);

    // Если cookie нет — выбираем случайную форму и запоминаем её
    if (selectedIndex === '') {
      selectedIndex = Math.floor(Math.random() * forms.length);
      setCookie(COOKIE_NAME, selectedIndex, 365); // Будет храниться 1 год
    }

    // Перенаправляем на выбранную форму
    window.location.replace(forms[selectedIndex]);
  </script>
</body>
</html>
